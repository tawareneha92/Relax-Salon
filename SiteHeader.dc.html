<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/colors.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/typography.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/radius.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/motion.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/tokens/base.css">
  <link rel="stylesheet" href="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/styles.css">
  <script src="_ds/ember-studio-design-system-c088a4fb-edf5-4916-9f14-505d2d613703/_ds_bundle.js"></script>
  <style>
    a{color:var(--color-primary);text-decoration:none}
    a:hover{color:var(--color-primary-hover)}
  </style>
</helmet>
<header style="position:sticky;top:0;z-index:40;background:rgba(250,250,249,0.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-default)">
  <div style="max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="index.dc.html" style="display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--text-primary)" aria-label="Relax Salon and Academy — home">
      <span style="font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:var(--tracking-display);line-height:1">Relax</span>
      <span style="font-family:var(--font-body);font-size:var(--text-overline);text-transform:uppercase;letter-spacing:var(--tracking-overline);color:var(--text-muted)">Salon &amp; Academy</span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Primary" style="display:flex;align-items:center;gap:24px">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="6">
          <a href="{{ link.href }}" aria-current="{{ link.current }}" style="font-size:var(--text-small);font-weight:600;text-decoration:none;padding:6px 0;color: {{ link.color }};border-bottom: {{ link.underline }}">{{ link.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:16px">
        <a href="tel:08329695493" style="display:inline-flex;align-items:center;gap:8px;font-size:var(--text-small);font-weight:600;color:var(--text-secondary);text-decoration:none;white-space:nowrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
          08329695493
        </a>
        <a href="contact.dc.html" style="text-decoration:none">
          <x-import component-from-global-scope="EmberStudioDesignSystem_c088a4.Button" size="medium" hint-size="auto,40px">Book an Appointment</x-import>
        </a>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px">
        <a href="tel:08329695493" aria-label="Call 08329695493" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-primary)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
        </a>
        <button type="button" onClick="{{ toggle }}" aria-expanded="{{ openStr }}" aria-label="{{ menuLabel }}" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-card);color:var(--text-primary);cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{ iconPath }}"/></svg>
        </button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Primary" style="border-top:1px solid var(--border-default);background:var(--surface-page);padding:12px 20px 20px;display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="6">
        <a href="{{ link.href }}" aria-current="{{ link.current }}" onClick="{{ close }}" style="display:flex;align-items:center;min-height:48px;font-size:var(--text-subhead);font-family:var(--font-display);font-weight:700;letter-spacing:var(--tracking-display);text-decoration:none;border-bottom:1px solid var(--border-default);color: {{ link.color }}">{{ link.label }}</a>
      </sc-for>
      <a href="contact.dc.html" onClick="{{ close }}" style="margin-top:12px;display:flex;align-items:center;justify-content:center;min-height:48px;background:var(--color-primary);color:var(--cream-50);border-radius:var(--radius-md);font-weight:600;text-decoration:none">Book an Appointment</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;About&quot;,&quot;Services&quot;,&quot;Portfolio&quot;,&quot;Blog&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, isDesktop: true };

  componentDidMount() {
    this.mq = window.matchMedia('(min-width: 900px)');
    this.sync = () => this.setState({ isDesktop: this.mq.matches, open: false });
    this.sync();
    this.mq.addEventListener('change', this.sync);
  }
  componentWillUnmount() { if (this.mq) this.mq.removeEventListener('change', this.sync); }

  renderVals() {
    const active = this.props.active || 'Home';
    const items = [
      ['Home', 'index.dc.html'], ['About', 'about.dc.html'], ['Services', 'services.dc.html'],
      ['Portfolio', 'portfolio.dc.html'], ['Blog', 'blog.dc.html'], ['Contact', 'contact.dc.html']
    ];
    const { open, isDesktop } = this.state;
    return {
      isDesktop,
      isMobile: !isDesktop,
      showMenu: !isDesktop && open,
      openStr: open ? 'true' : 'false',
      menuLabel: open ? 'Close menu' : 'Open menu',
      iconPath: open ? 'M6 6l12 12M18 6L6 18' : 'M3 6h18M3 12h18M3 18h18',
      toggle: () => this.setState((s) => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
      links: items.map(([label, href]) => ({
        label, href,
        current: label === active ? 'page' : undefined,
        color: label === active ? 'var(--color-primary)' : 'var(--text-secondary)',
        underline: label === active ? '2px solid var(--color-primary)' : '2px solid transparent'
      }))
    };
  }
}
</script>
</body>
</html>
